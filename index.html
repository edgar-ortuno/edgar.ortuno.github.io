
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Página personal de Edgar Ortuño.">
  <title>Edgar Ortuño</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { min-height: 100%; }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      font-weight: 300;
      padding: 70px 20px 80px;
      background: #000;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      overflow-x: hidden;
      transition: background .4s ease, color .4s ease;
    }

    body.modo-dia {
      background: #fff;
      color: #000;
    }

    body.modo-dia p { color: #333; }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    .boton-menu {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      font-size: 1.5rem;
      padding: 8px 12px;
      cursor: pointer;
      z-index: 1000;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      transition: transform .3s ease, background .3s ease;
    }

    body.modo-dia .boton-menu {
      background: rgba(0,0,0,.08);
      border-color: rgba(0,0,0,.15);
      color: #000;
    }

    .boton-menu:hover { transform: scale(1.05); }

    .boton-tema {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #fff;
      color: #000;
      border: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 1000;
      transition: transform .3s ease, background .4s ease, color .4s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,.3);
    }

    body.modo-dia .boton-tema {
      background: #000;
      color: #fff;
    }

    .boton-tema:hover { transform: scale(1.1); }

    .boton-archivos {
      position: fixed;
      bottom: 22px;
      left: 15px;
      background: #fff;
      color: #000;
      border: 1px solid rgba(0,0,0,.3);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: .95rem;
      font-weight: 400;
      text-decoration: none;
      z-index: 1000;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    body.modo-dia .boton-archivos {
      background: #000;
      color: #fff;
      border-color: rgba(255,255,255,.3);
    }

    .boton-archivos:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }

    .menu-lateral {
      position: fixed;
      left: -170px;
      top: 0;
      height: 100vh;
      height: 100svh;
      width: 170px;
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid rgba(255,255,255,.1);
      padding-top: 70px;
      display: flex;
      flex-direction: column;
      z-index: 999;
      transition: left .3s ease;
    }

    body.modo-dia .menu-lateral {
      background: rgba(255,255,255,.94);
      border-right-color: rgba(0,0,0,.1);
    }

    .menu-lateral.activo { left: 0; }

    .menu-lateral a {
      display: block;
      color: inherit;
      padding: 12px 18px;
      text-decoration: none;
      font-size: 1rem;
      text-align: left;
      transition: background .3s ease, padding-left .3s ease;
    }

    .menu-lateral a:hover {
      background: rgba(255,255,255,.1);
      padding-left: 22px;
    }

    body.modo-dia .menu-lateral a:hover {
      background: rgba(0,0,0,.08);
    }

    .nombre-titulo {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 300;
      margin: 10px 0 12px;
      letter-spacing: 2px;
      color: inherit;
    }

    p {
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 300;
      color: #e0e0e0;
      max-width: 600px;
      margin: 0 auto 45px;
      transition: color .4s ease;
    }

    .social-buttons {
      position: absolute;
      top: calc(50% + 10px);
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(100%, 300px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 28px;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 500;
      transition: transform .3s ease, box-shadow .3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      user-select: none;
    }

    .btn:hover { transform: translateY(-5px); }

    .btn i {
      font-size: 1.6rem;
      font-weight: 900;
      font-style: normal;
    }

    .btn-facebook {
      background: #1877f2;
      color: #fff;
    }

    .btn-instagram {
      background: linear-gradient(135deg,#ff6c5c,#ff2e63,#a855f7);
      color: #fff;
    }

    .btn-tiktok {
      background: #fff;
      color: #000;
      border: 2px solid #000;
    }

    .btn-x {
      background: #000;
      color: #fff;
      border: 1px solid #333;
    }

    body.modo-dia .btn-x {
      background: #fff;
      color: #000;
      border-color: #ddd;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #fff;
    }

    .elemento-lluvia {
      position: fixed;
      pointer-events: none;
      animation: lluvia 3s ease-in forwards;
      z-index: 500;
      top: 15px;
      user-select: none;
    }

    .corazon-cafe {
      font-size: 1.5rem;
      color: #8b4513;
    }

    @keyframes lluvia {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .firma {
      position: fixed;
      bottom: 10px;
      right: 25px;
      font-family: 'Segoe Script', 'Brush Script MT', cursive;
      font-size: 1.3rem;
      color: #fff;
      font-weight: normal;
      text-decoration: none;
      z-index: 1;
      opacity: .9;
    }

    @media (max-height: 650px) {
      body { padding-top: 62px; }

      .social-buttons {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        margin: 30px auto 0;
      }

      p { margin-bottom: 25px; }
    }

    @media (max-width: 360px) {
      body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .social-buttons {
        width: min(100%, 280px);
        gap: 12px;
      }

      .btn { padding: 14px 18px; }

      .firma {
        right: 15px;
        font-size: 1.1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <button class="boton-menu" id="botonMenu" type="button"
          aria-label="Abrir menú" aria-controls="miMenu"
          aria-expanded="false">
    <i class="fas fa-bars" aria-hidden="true"></i>
  </button>

  <button class="boton-tema" id="botonTema" type="button"
          aria-label="Cambiar al modo día" title="Cambiar tema">
    <i class="fas fa-moon" id="icono-tema" aria-hidden="true"></i>
  </button>

  <a href="https://edgar-ortuno.github.io/archivos/"
     target="_blank" rel="noopener noreferrer"
     class="boton-archivos">Archivos</a>

  <nav class="menu-lateral" id="miMenu"
       aria-label="Menú principal" aria-hidden="true">

    <a href="https://youtu.be/CIOq0qkZjcU?si=TS7SsueL4xG5JSD7"
       target="_blank" rel="noopener noreferrer">
       Más Información. :)
    </a>

    <a href="#" id="enlaceOrtuno">Ortuño :(</a>
    <a href="#" id="enlaceAcerca">Acerca De</a>
  </nav>

  <main>
    <h1 class="nombre-titulo">Edgar Ortuño</h1>
    <p>Bienvenid@ a mi página personal ✨</p>

    <div class="social-buttons" id="contenedor-redes"
         aria-label="Redes sociales">

      <a href="https://www.facebook.com/share/1D9C18NVvc/"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-facebook">
        <i class="fab fa-facebook-f" aria-hidden="true"></i>
        Facebook
      </a>

      <a href="https://www.instagram.com/edgar_ortuno_?igsh=YzJ2anh0cWk0bXBs"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-instagram">
        <i class="fab fa-instagram" aria-hidden="true"></i>
        Instagram
      </a>

      <a href="https://www.tiktok.com/@edgar_ortuno"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-tiktok">
        <i class="fab fa-tiktok" aria-hidden="true"></i>
        TikTok
      </a>

      <a href="https://x.com/edgar_ortuno_"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-x">
        <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
        X
      </a>

      <a href="https://wa.me/59171274987"
         target="_blank" rel="noopener noreferrer"
         class="btn btn-whatsapp">
        <i class="fab fa-whatsapp" aria-hidden="true"></i>
        WhatsApp
      </a>

    </div>
  </main>

  <div class="firma">edgr.</div>

  <script>
    'use strict';

    const menu = document.getElementById('miMenu');
    const botonMenu = document.getElementById('botonMenu');
    const botonTema = document.getElementById('botonTema');
    const iconoTema = document.getElementById('icono-tema');

    function cerrarMenu() {
      menu.classList.remove('activo');
      menu.setAttribute('aria-hidden', 'true');
      botonMenu.setAttribute('aria-expanded', 'false');
      botonMenu.setAttribute('aria-label', 'Abrir menú');
    }

    function alternarMenu() {
      const abrir = !menu.classList.contains('activo');

      menu.classList.toggle('activo', abrir);
      menu.setAttribute('aria-hidden', String(!abrir));
      botonMenu.setAttribute('aria-expanded', String(abrir));
      botonMenu.setAttribute(
        'aria-label',
        abrir ? 'Cerrar menú' : 'Abrir menú'
      );
    }

    function cambiarTema() {
      document.body.classList.toggle('modo-dia');

      const esDia = document.body.classList.contains('modo-dia');

      iconoTema.className = esDia
        ? 'fas fa-sun'
        : 'fas fa-moon';

      botonTema.setAttribute(
        'aria-label',
        esDia ? 'Cambiar al modo noche' : 'Cambiar al modo día'
      );

      document.querySelector('meta[name="theme-color"]').content =
        esDia ? '#ffffff' : '#000000';
    }

    function crearLluvia(cantidad) {
      const fragmento = document.createDocumentFragment();

      for (let i = 0; i < cantidad; i++) {
        const elemento = document.createElement('div');

        elemento.className = 'elemento-lluvia corazon-cafe';
        elemento.textContent = '🤎';
        elemento.style.left = (Math.random() * 100) + 'vw';
        elemento.style.animationDuration =
          (1.5 + Math.random() * 2) + 's';
        elemento.style.animationDelay = (i * 50) + 'ms';

        fragmento.appendChild(elemento);

        elemento.addEventListener(
          'animationend',
          () => elemento.remove(),
          { once: true }
        );
      }

      document.body.appendChild(fragmento);
    }

    botonMenu.addEventListener('click', (event) => {
      event.stopPropagation();
      alternarMenu();
    });

    botonTema.addEventListener('click', cambiarTema);

    document.addEventListener('click', (event) => {
      if (
        menu.classList.contains('activo') &&
        !menu.contains(event.target) &&
        !botonMenu.contains(event.target)
      ) {
        cerrarMenu();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') cerrarMenu();
    });

    document.getElementById('enlaceOrtuno')
      .addEventListener('click', (event) => {
        event.preventDefault();
        cerrarMenu();
        crearLluvia(30);
      });

    document.getElementById('enlaceAcerca')
      .addEventListener('click', (event) => {
        event.preventDefault();
        cerrarMenu();
        alert('Xd');
      });
  </script>

</body>
</html>
